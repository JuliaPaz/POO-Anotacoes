spring.application.name=notas-ia

# Banco de dados (H2 em arquivo - não precisa instalar nada)
spring.datasource.url=jdbc:h2:file:./data/notasdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Spring AI / Ollama (IA local)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.5
